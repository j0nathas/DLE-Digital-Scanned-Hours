<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema DLE — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b12; --surface: #0e1220; --card: #131826; --border: rgba(99,102,241,0.18);
      --accent: #6366f1; --accent2: #818cf8; --text: #e2e8f0; --muted: #64748b;
      --danger: #ef4444; --success: #10b981; --input-bg: #0a0d16;
    }
    html, body { height: 100%; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; overflow: hidden; }
    .background { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .background::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(99,102,241,0.5), rgba(99,102,241,0.5)), url('../assets/back.jpg');
      background-size: cover; background-position: center; opacity: 0.5; z-index: -1;
    }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    body::after { content: ''; position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 700px; height: 500px; background: radial-gradient(ellipse, rgba(99,102,241,0.12) 0%, transparent 70%); pointer-events: none; }
    .login-wrapper { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 1; }
    .login-card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 0 60px rgba(99,102,241,0.08), 0 24px 48px rgba(0,0,0,0.5); animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .card-header { padding: 32px 36px 28px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
    .card-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent)); background-size: 200% 100%; animation: shimmer 3s linear infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .logo-text { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #fff; }
    .logo-text span { color: var(--accent2); }
    .card-subtitle { color: var(--muted); font-size: 13px; font-weight: 300; }
    .plant-selector { padding: 20px 36px 0; }
    .plant-label { font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .plant-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .plant-btn { background: var(--input-bg); border: 1px solid rgba(99,102,241,0.15); border-radius: 8px; padding: 10px 8px; cursor: pointer; text-align: center; transition: all 0.2s; color: var(--muted); }
    .plant-btn:hover { border-color: rgba(99,102,241,0.4); color: var(--text); }
    .plant-btn.active { background: rgba(99,102,241,0.12); border-color: var(--accent); color: var(--accent2); }
    .plant-btn .plant-code { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1px; display: block; line-height: 1; }
    .plant-btn .plant-city { font-size: 10px; display: block; margin-top: 3px; opacity: 0.7; }
    .card-form { padding: 20px 36px 32px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-wrap input { width: 100%; background: var(--input-bg); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; padding: 11px 40px 11px 14px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .input-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
    .btn-login { width: 100%; background: linear-gradient(135deg, var(--accent), #4f46e5); border: none; border-radius: 8px; padding: 13px; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; transition: opacity 0.2s, transform 0.1s; }
    .btn-login .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    .alert { border-radius: 8px; padding: 11px 14px; font-size: 13px; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
    .alert.show { display: flex; }
    .alert.erro { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert.sucesso { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .card-footer { padding: 14px 36px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .footer-magna { font-size: 11px; color: var(--muted); font-weight: 300; }
    .footer-version { font-size: 10px; color: rgba(100,116,139,0.5); font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
    .recovery-panel { display: none; }
    .recovery-panel.show { display: block; }
    .main-panel.hide { display: none; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; margin-bottom: 16px; background: none; border: none; padding: 0; }
  </style>
</head>
<body class="background">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="card-header">
        <div class="logo-area"><div class="logo-icon">⚙️</div><div class="logo-text">SISTEMA <span>DLE</span></div></div>
        <div class="card-subtitle">Magna International — Acesso ao sistema</div>
      </div>

      <div class="main-panel" id="mainPanel">
        <div style="margin-top: 15px; text-align: center;">
            <a href="#" id="linkAdmin" onclick="ativarModoAdmin(); return false;" style="color:var(--muted); font-size:12px; text-decoration:none;">⚙️ Acesso Administrativo (Gestão de Usuários)</a>
        </div>

        <div class="plant-selector">
          <div class="plant-label">Selecione a planta</div>
          <div class="plant-options">
            <button class="plant-btn" data-planta="MLB" onclick="selecionarPlanta(this)"><span class="plant-code">MLB</span><span class="plant-city">São Bernardo</span></button>
            <button class="plant-btn" data-planta="MJN" onclick="selecionarPlanta(this)"><span class="plant-code">MJN</span><span class="plant-city">Jarinu</span></button>
            <button class="plant-btn" data-planta="MMB" onclick="selecionarPlanta(this)"><span class="plant-code">MMB</span><span class="plant-city">Vinhedo</span></button>
          </div>
        </div>

        <div class="card-form">
          <div class="alert erro" id="alertErro"><span>⚠️</span><span id="alertErroMsg"></span></div>
          <div class="field"><label>Usuário de rede</label><div class="input-wrap"><input type="text" id="inputLogin" placeholder="ex: jonave10" autocomplete="username"><span class="input-icon">👤</span></div></div>
          <div class="field"><label>Senha</label><div class="input-wrap"><input type="password" id="inputSenha" placeholder="Senha de rede" autocomplete="current-password"><span class="input-icon" style="cursor:pointer" onclick="toggleSenha()">👁</span></div></div>
          <div class="form-footer-link"><a href="#" onclick="mostrarRecuperacao(); return false;" style="color:var(--muted); font-size:12px; text-decoration:none;">Esqueci minha senha</a></div>
          <button class="btn-login" id="btnLogin" onclick="fazerLogin()"><span class="btn-text">Entrar</span><div class="spinner"></div></button>
        </div>
      </div>

      <div class="recovery-panel" id="recoveryPanel">
        <div class="card-form">
          <button class="back-link" onclick="mostrarLogin()">← Voltar ao login</button>
          <div class="alert erro" id="alertRecErro"><span>⚠️</span><span id="alertRecErroMsg"></span></div>
          <div class="alert sucesso" id="alertRecSucesso"><span>✅</span><span id="alertRecSucessoMsg"></span></div>
          <p style="color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6;">Informe seu login de rede e planta.</p>
          <div class="field"><label>Planta</label><select id="recPlanta" style="width:100%;background:var(--input-bg);color:white;border:1px solid var(--border);border-radius:8px;padding:11px 14px;"><option value="MLB">MLB</option><option value="MJN">MJN</option><option value="MMB">MMB</option></select></div>
          <div class="field"><label>Login de rede</label><input type="text" id="recLogin" placeholder="ex: jonave10" style="width:100%;background:var(--input-bg);color:white;border:1px solid var(--border);border-radius:8px;padding:11px 14px;"></div>
          <button class="btn-login" id="btnRecuperar" onclick="solicitarRecuperacao()"><span class="btn-text">Enviar instruções</span><div class="spinner"></div></button>
        </div>
      </div>

      <div class="card-footer"><span class="footer-magna">© Magna International</span><span class="footer-version">DLE v0.1.0-alfa</span></div>
    </div>
  </div>

  <script>
    const API = '';
    let plantaSelecionada = null;
    let modoAdmin = false;

    function ativarModoAdmin() {
        modoAdmin = true;
        const btn = document.getElementById('btnLogin');
        btn.querySelector('.btn-text').textContent = 'Entrar como Admin';
        btn.style.background = 'linear-gradient(135deg, #4338ca, #1e1b4b)';
        mostrarErro('alertErro', 'alertErroMsg', 'Modo Administrativo ativado. Somente administradores.');
        document.getElementById('alertErro').className = 'alert sucesso show';
    }

    function selecionarPlanta(btn) {
      document.querySelectorAll('.plant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      plantaSelecionada = btn.dataset.planta;
    }

    function toggleSenha() {
      const input = document.getElementById('inputSenha');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function mostrarErro(idAlert, idMsg, mensagem) {
      document.getElementById(idMsg).textContent = mensagem;
      document.getElementById(idAlert).classList.add('show');
    }

    function esconderErro(idAlert) {
      document.getElementById(idAlert).classList.remove('show');
    }

    async function fazerLogin() {
      esconderErro('alertErro');
      const login = document.getElementById('inputLogin').value.trim();
      const senha = document.getElementById('inputSenha').value;

      if (!plantaSelecionada || !login || !senha) return mostrarErro('alertErro', 'alertErroMsg', 'Preencha todos os campos.');

      const btn = document.getElementById('btnLogin');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, senha, planta: plantaSelecionada, adminOnly: modoAdmin }),
        });

        const data = await res.json();
        if (!res.ok) {
            btn.classList.remove('loading'); btn.disabled = false;
            return mostrarErro('alertErro', 'alertErroMsg', data.erro || 'Falha na autenticação.');
        }

        localStorage.setItem('dle_token', data.token);
        localStorage.setItem('dle_usuario', JSON.stringify(data.usuario));
        window.location.href = modoAdmin ? '/index.html#usuarios' : '/index.html';

      } catch (e) {
        btn.classList.remove('loading'); btn.disabled = false;
        mostrarErro('alertErro', 'alertErroMsg', 'Erro de conexão.');
      }
    }

    function mostrarRecuperacao() { document.getElementById('mainPanel').classList.add('hide'); document.getElementById('recoveryPanel').classList.add('show'); }
    function mostrarLogin() { document.getElementById('mainPanel').classList.remove('hide'); document.getElementById('recoveryPanel').classList.remove('show'); }
  </script>
</body>
</html>

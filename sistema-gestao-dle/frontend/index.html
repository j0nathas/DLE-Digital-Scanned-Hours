<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão DLE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo"><IMG src="./assets/logo-dle-branco-png.png" width="160"></IMG></div>
            <nav>
                <ul>
                    <li><a href="#selecao">    <i>📍</i>Trocar Planta</a></li>
                    <li><a href="#gestao">     <i>🏭 </i>Gestão da Planta</a></li>
                    <li><a href="#indicadores"><i>📊 </i>Indicador Horas (Fábrica)</a></li>
                    <li><a href="#financeiro"> <i>💲</i>Indicador Horas (Financeiro)</a></li>
                    <li><a href="#rh">         <i>👥</i>Indicador Horas (RH)</a></li>
                    <li><a href="#calculo-dle"><i>⚙️</i>Cálculo DLE</a></li>
                    <li><a href="#gestao-fabrica"><i></i>Gestão KPI's da Fábrica</a></li>
                    <li id="menuUsuarios" style="display:none"><a href="#usuarios"><i>👥</i>Controle de Usuários</a></li>
                </ul>
            </nav>
            <div class="version">Alfa 0.0.1</div>
        </aside>

        <main id="main-content" class="main-content">
            <header>
                <div class="header-info">
                    <h2 id="header-title">Carregando...</h2>
                    <div id="header-datetime" class="datetime"></div>
                </div>
                <!--
                  O nome do usuário é preenchido dinamicamente pelo main.js
                  a partir do token JWT salvo no localStorage.
                  Clicar no nome exibe opção de logout.
                -->
                <div class="user-profile" title="Clique para sair">Carregando...</div>
            </header>

            <div id="dynamic-content-wrapper">
                <!-- O conteúdo dinâmico será carregado aqui -->
            </div>
        </main>
    </div>

    <!-- Modal de Popup -->
    <div id="operator-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Operadores na Máquina</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/planta-selection.js" defer></script>
    <script src="js/gestao.js"           defer></script>
    <script src="js/indicadores.js"      defer></script>
    <script src="js/financeiro.js"       defer></script>
    <script src="js/rh.js"              defer></script>
    <script src="js/calculo-dle.js"     defer></script>
    <script src="js/kpi-fabrica.js" defer></script>
    <script src="js/main.js"            defer></script>
</body>
</html>

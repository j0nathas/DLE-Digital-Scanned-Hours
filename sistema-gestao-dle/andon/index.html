<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Andon Analytics Ultimate</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
    <header>
        <h1>Andon Analytics Pro</h1>
        <div class="filters">
            <div class="filter-group"><label>Início</label><input type="date" id="dataDe"></div>
            <div class="filter-group"><label>Fim</label><input type="date" id="dataAte"></div>
            <div class="filter-group"><label>Máquina</label><select id="filterMaquina"><option value="TODOS">Todas</option></select></div>
            <div class="filter-group"><label>Mês</label><select id="filterMes">
                <option value="TODOS">Todos</option>
                <option value="0">Jan</option><option value="1">Fev</option><option value="2">Mar</option>
                <option value="3">Abr</option><option value="4">Mai</option><option value="5">Jun</option>
                <option value="6">Jul</option><option value="7">Ago</option><option value="8">Set</option>
                <option value="9">Out</option><option value="10">Nov</option><option value="11">Dez</option>
            </select></div>
            <div class="filter-group"><label>Turno</label><select id="filterTurno"><option value="TODOS">Todos</option><option value="1">T1</option><option value="2">T2</option><option value="3">T3</option></select></div>
            <div class="filter-group"><label>Tipo</label><select id="filterTipoMov"><option value="TODOS">Todos</option><option value="F">Fabricação</option><option value="P">Parada</option></select></div>
            <div class="filter-group"><label>Prevista</label><select id="filterPrevista"><option value="TODOS">Todas</option><option value="S">Sim</option><option value="N">Não</option></select></div>
            <button id="btnAtualizar">Atualizar</button>
        </div>
    </header>
    <main>
        <div class="cards-resumo">
            <div class="card"><h3>Ocorrências</h3><p id="totalQtd">0</p></div>
            <div class="card"><h3>Tempo Total</h3><p id="totalTempo">00:00:00</p></div>
            <div class="card"><h3>MTTR</h3><p id="totalMedia">00:00:00</p></div>
            <div class="card"><h3>Média Dia</h3><p id="mediaDia">0</p></div>
        </div>
        <div class="charts-grid">
            <div class="chart-box full-width">
                <div style="display: flex; justify-content: space-between;"><h4 id="mainTitle">Performance</h4><button id="btnVoltar">← Voltar</button></div>
                <div class="canvas-container"><canvas id="chartMain"></canvas></div>
            </div>
            <div class="chart-box"><h4>Motivos (Qtd)</h4><div class="canvas-container"><canvas id="chartParetoQtd"></canvas></div></div>
            <div class="chart-box"><h4>Motivos (Tempo)</h4><div class="canvas-container"><canvas id="chartParetoTempo"></canvas></div></div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
